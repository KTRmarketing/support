<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTR 지원사업 공고문 열람</title>
<style>
:root{--ktr-blue:#20469b;--ktr-blue-dark:#17387f;--ktr-sky:#eaf1ff;--line:#d8e1ee;--bg:#f4f7fb;--text:#1c2a39;--muted:#66788a;font-family:system-ui,"Malgun Gothic",sans-serif}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text)}
header{background:var(--ktr-blue);color:#fff;border-bottom:3px solid #15306c}
.header-inner{max-width:1680px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:16px;min-height:72px}
.ci-box{display:flex;align-items:center;min-width:0}
.ci-image{display:block;width:min(330px,56vw);height:auto;object-fit:contain;object-position:left center;background:transparent}
.main-title{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;align-self:center;gap:3px;white-space:nowrap;flex-shrink:0;text-align:right;padding-bottom:0}
.team-name{font-size:15px;font-weight:750;line-height:1.2;letter-spacing:-.2px;color:#fff}
.update-date{font-size:11px;line-height:1.2;font-weight:500;color:rgba(255,255,255,.84)}
.layout{display:grid;grid-template-columns:375px minmax(0,1fr);gap:16px;max-width:1680px;margin:0 auto;padding:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.left{display:flex;flex-direction:column;height:calc(100vh - 72px)}
.filter-wrap{padding:12px 14px 13px;border-bottom:1px solid #e7edf4;background:#fbfdff}
.filter-group+.filter-group{margin-top:12px;padding-top:11px;border-top:1px solid #edf1f6}
.filter-heading{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:12px;font-weight:800;color:#405875}
.filter-heading::before{content:"";display:inline-block;width:3px;height:13px;border-radius:3px;background:var(--ktr-blue)}
.filter-options{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-btn{border:1px solid #ced9e8;border-radius:7px;padding:6px 10px;background:white;color:#4a5e75;font:inherit;font-size:12px;font-weight:600;line-height:1.3;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.filter-btn:hover{border-color:#809ed2;background:#f2f6ff}
.filter-btn.active{background:var(--ktr-blue);border-color:var(--ktr-blue);color:white;box-shadow:0 2px 6px rgba(32,70,155,.15)}
.filter-btn:focus-visible{outline:2px solid #7ea4e9;outline-offset:2px}
.toolbar{padding:10px 14px;border-bottom:1px solid #edf1f5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.count{color:var(--muted);font-size:13px;font-weight:700}
.sort-box{display:flex;gap:6px;flex-wrap:wrap}
.sort-btn{border:1px solid #ced9e8;border-radius:9px;padding:6px 11px;background:#fff;color:#4a5e75;font:inherit;font-size:12px;font-weight:700;line-height:1.3;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.sort-btn:hover{border-color:#809ed2;background:#f2f6ff}
.sort-btn.active{background:#fff7e6;border-color:#f0c86e;color:#8b6500;box-shadow:0 2px 6px rgba(240,200,110,.22)}
.items{overflow:auto;flex:1}
.item{width:100%;border:0;border-bottom:1px solid #e8edf2;text-align:left;background:#fff;padding:14px 14px 12px;cursor:pointer;color:inherit;position:relative}
.item.active,.item:hover{background:#edf4ff}.item strong{display:block;font-size:14px;line-height:1.48;word-break:keep-all}.item small{display:block;margin-top:7px;color:#6c7c8d;font-size:12px}.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.item-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.item-date{color:#70839a;font-size:12px;font-weight:600;white-space:nowrap}.item-badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef3ff;color:#3658a8;font-size:11px;font-weight:700}.dchip{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:-.2px}.dchip.soon{background:#ffe4e1;color:#d24848}.dchip.mid{background:#fff1cf;color:#9b6800}.dchip.ok{background:#dff4e7;color:#27835b}.dchip.end{background:#edf1f5;color:#6d7988}
.right{display:flex;flex-direction:column;min-height:calc(100vh - 72px)}
.heading{padding:16px 22px;border-bottom:1px solid #e7edf4;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.heading-main{min-width:0}.detail-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.heading h2{margin:0;font-size:22px;line-height:1.4;letter-spacing:-.2px;word-break:keep-all}
.link-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:10px;background:var(--ktr-blue);color:#fff;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(32,70,155,.18);border:1px solid rgba(0,0,0,.06)}
.link-btn:hover{background:var(--ktr-blue-dark)}
.content{padding:0 22px 22px}
.overview{padding:6px 0 10px}
.overview-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;padding:13px 0;border-bottom:1px solid #e9eef4;font-size:14px;line-height:1.7}
.overview-label{font-weight:800;color:#223754}.overview-value{white-space:pre-line;overflow-wrap:break-word;max-width:980px;word-break:keep-all;color:#24313f}
.overview-row:last-child .overview-value{line-height:1.5}
.overview-paragraph{margin:0 0 16px}.overview-paragraph:last-child{margin:0}.overview-point{display:block;margin:8px 0 0 0;padding-left:18px;text-indent:-13px}
.preview-shell{padding-top:14px}
.preview-card{max-width:1080px;margin:0 auto;background:#fff;border:1px solid #d7e0ec;border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(23,41,71,.05)}
.preview-frame{display:block;width:min(100%,920px);height:1080px;margin:0 auto;border:1px solid #cfd8e4;border-radius:8px;background:#fff}
.empty{max-width:900px;margin:0 auto;border:1px dashed #bfd0e6;border-radius:12px;background:#f8fbff;padding:40px 24px;text-align:center;color:#5d6d80;line-height:1.9}.empty a{color:var(--ktr-blue);font-weight:700;text-decoration:none}
@media(max-width:1200px){.layout{grid-template-columns:340px minmax(0,1fr)} .preview-frame{width:min(100%,860px);height:1000px}}
@media(max-width:920px){.layout{display:block}.left{height:340px;margin-bottom:12px}.right{min-height:unset}.heading{flex-direction:column}.ci-image{width:min(330px,53vw)}.team-name{font-size:13px}.update-date{font-size:10px}.overview-row{grid-template-columns:120px minmax(0,1fr)}.preview-frame{width:100%;height:820px}.content{padding:0 14px 16px}.heading{padding:14px 16px}.header-inner{padding:8px 14px;min-height:62px}.toolbar{padding:10px 12px}}
</style></head><body>

function previews(x){const arr=(x.documents||[]).filter(d=>d.preview).sort((a,b)=>docScore(b)-docScore(a)); let seen=new Set(); return arr.filter(d=>{let key=(d.name||'').replace(/\s+/g,'').toLowerCase(); if(seen.has(key))return false; seen.add(key); return true;});}
// 엑셀의 분야/권역에서 버튼을 자동 생성합니다.

function sortedFilterValues(field){
 const counts=new Map();
 for(const item of DATA){
  const value=String(item[field]||'').trim();
  if(!value || value==='전체')continue;
  counts.set(value,(counts.get(value)||0)+1);
 }
 return [...counts.keys()].sort((a,b)=>{
  if(a==='공통')return -1;
  if(b==='공통')return 1;
  return counts.get(b)-counts.get(a) || a.localeCompare(b,'ko');
 });
}

});
const industries=sortedFilterValues('industry');
const regions=sortedFilterValues('region');
const sortOptions=[{key:'deadline',label:'마감임박순'},{key:'latest',label:'최신순'}];

function parseDate(value){
 const s=String(value||'').trim();
 if(!s) return null;
 const m=s.match(/(\d{4})[.\/-]?(\d{1,2})[.\/-]?(\d{1,2})/);
 if(!m) return null;
 const d=new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
 return Number.isNaN(d.getTime()) ? null : d;
}
function endDate(item){return parseDate(item.end);} 
function postedDate(item){return parseDate(item.posted) || parseDate(item.start) || parseDate(item.end);} 
function deadlineInfo(item){
 const d=endDate(item);
 if(!d) return {text:'기한없음',cls:'end',days:null,date:''};
 const diff=Math.floor((d-TODAY)/(1000*60*60*24));
 if(diff<0) return {text:'마감',cls:'end',days:diff,date:formatShortDate(d)};
 if(diff===0) return {text:'D-Day',cls:'soon',days:0,date:formatShortDate(d)};
 return {text:`D-${diff}`,cls:diff<=7?'soon':diff<=14?'mid':'ok',days:diff,date:formatShortDate(d)};
}
function formatShortDate(d){
 if(!d) return '';
 const y=String(d.getFullYear()).slice(-2);
 const m=String(d.getMonth()+1).padStart(2,'0');
 const day=String(d.getDate()).padStart(2,'0');
 return `~ ${y}.${m}.${day}`;
}
function sortRows(rows){
 const list=[...rows];
 list.sort((a,b)=>{
   if(sortMode==='latest'){
     const ad=postedDate(a), bd=postedDate(b);
     const av=ad?ad.getTime():-1, bv=bd?bd.getTime():-1;
     return bv-av || a._i-b._i;
   }
   const ai=deadlineInfo(a), bi=deadlineInfo(b);
   const rank = x => x.days===null ? 3 : (x.days<0 ? 2 : 1);
   return rank(ai)-rank(bi) || ((ai.days??99999)-(bi.days??99999)) || a._i-b._i;
 });
 return list;
}
function renderSort(){
 $('sortBox').innerHTML=sortOptions.map(o=>`<button type="button" class="sort-btn ${sortMode===o.key?'active':''}" data-sort="${o.key}">${o.label}</button>`).join('');
 $('sortBox').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{sortMode=btn.dataset.sort; renderSort(); renderList();}));
}
function renderFilterGroup(elementId, values, active, kind){
 const wrap=$(elementId);
 wrap.innerHTML=['',...values].map(value=>`<button type="button" class="filter-btn ${value===active?'active':''}" data-value="${escapeHtml(value)}" aria-pressed="${value===active?'true':'false'}">${escapeHtml(value||'전체')}</button>`).join('');
 wrap.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
  if(kind==='major')selectedMajor=btn.dataset.value;
  else if(kind==='industry')selectedIndustry=btn.dataset.value;
  else selectedRegion=btn.dataset.value;
  renderFilters(); renderSort(); renderList();
 }));
}
function renderFilters(){
 $('majorGroup').style.display=majors.length ? '' : 'none';
 if(majors.length)renderFilterGroup('majorFilters',majors,selectedMajor,'major');
 renderFilterGroup('industryFilters',industries,selectedIndustry,'industry');
 renderFilterGroup('regionFilters',regions,selectedRegion,'region');
}
function filtered(){return DATA.map((x,i)=>({...x,_i:i})).filter(x=>(!selectedMajor||x.major===selectedMajor)&&(!selectedIndustry||x.industry===selectedIndustry)&&(!selectedRegion||x.region===selectedRegion));}
function renderList(){const rows=sortRows(filtered()); $('count').textContent=`전체 ${DATA.length}건 중 ${rows.length}건`; if(!rows.some(r=>r._i===selected)){selected=rows.length?rows[0]._i:-1;}
$('items').innerHTML=rows.map(x=>{const dd=deadlineInfo(x); const endText=dd.date || (x.end?escapeHtml(x.end):''); return `<button class="item ${selected===x._i?'active':''}" data-i="${x._i}"><div class="item-badges"><span class="dchip ${dd.cls}">${dd.text}</span></div><small>${escapeHtml(x.org||'')}</small><strong>${escapeHtml(x.title)}</strong><div class="item-footer"><div class="meta">${x.industry?`<span class="chip">#${escapeHtml(x.industry)}</span>`:''}${x.region?`<span class="chip">#${escapeHtml(x.region)}</span>`:''}</div><div class="item-date">${escapeHtml(endText)}</div></div></button>`;}).join('') || '<div class="empty" style="margin:12px;">조건에 맞는 공고가 없습니다.</div>';
document.querySelectorAll('.item').forEach(e=>e.addEventListener('click',()=>{selected=Number(e.dataset.i); renderList(); renderDetail();})); renderDetail();}
function overviewText(v){let text=String(v||''); text=text.split(/(?=\s*(?:사업신청방법|사업신청 사이트|문의처|해시태그 목록)\s*[:：]?)/)[0]; const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean); return lines.map(line=>{const bullet=/^(?:[☞▷▶▪•※\-]|\d+[.)])/.test(line); return `<p class="overview-paragraph${bullet?' overview-point':''}">${escapeHtml(line)}</p>`;}).join('');}
function renderDetail(){const x=selected>=0?DATA[selected]:undefined; if(!x){$('title').textContent='조건에 맞는 공고가 없습니다'; $('detailMeta').innerHTML=''; $('overview').innerHTML=''; $('source').style.display='none'; $('preview').innerHTML='<div class="empty">다른 분야나 권역을 선택해 주세요.</div>'; return;}
$('source').style.display='inline-flex';
$('title').textContent=x.title; const url=validUrl(x.url); $('source').href=url||'#'; $('source').setAttribute('aria-disabled', url?'false':'true');
const dd=deadlineInfo(x); $('detailMeta').innerHTML=`<span class="dchip ${dd.cls}">${dd.text}</span>${x.industry?`<span class="chip">#${escapeHtml(x.industry)}</span>`:''}${x.region?`<span class="chip">#${escapeHtml(x.region)}</span>`:''}`;
const source=x.overview||{}; const entries=[['소관부처·지자체', source['소관부처·지자체']||x.department||''], ['사업수행기관', source['사업수행기관']||x.org||''], ['신청기간', source['신청기간']||[x.start,x.end].filter(Boolean).join(' ~ ')], ['사업개요', source['사업개요']||'공식 공고페이지에서 확인']];
$('overview').innerHTML=entries.filter(y=>y[1]).map(([label,value])=>`<div class="overview-row"><div class="overview-label">${escapeHtml(label)}</div><div class="overview-value">${label==='사업개요'?overviewText(value):escapeHtml(value)}</div></div>`).join('');
const docs=previews(x); const box=$('preview'); if(!docs[0]){box.innerHTML='<div class="empty">PDF 미리보기를 확보하지 못했습니다.<br>공고문 PDF가 없는 경우이거나, 첨부파일 다운로드 방식 때문에 자동 수집이 실패했을 수 있습니다.<br><a href="'+escapeHtml(url||'#')+'" target="_blank" rel="noopener noreferrer">원문 링크 열기</a></div>'; return;}
box.innerHTML='<div class="preview-card"><iframe class="preview-frame" title="공고문 PDF 미리보기" loading="eager" src="'+encodeURI(docs[0].preview)+'#toolbar=1&navpanes=0&view=FitH"></iframe></div>';}
renderFilters(); renderSort(); renderList();
</script></body></html>
